name: NBA Bot Auto-Trainer & Calibrator

on:
  schedule:
    # Uruchamia się codziennie o 9:00 rano UTC (10:00 czasu polskiego) po zakończeniu nocy w NBA
    - cron: '0 9 * * *'
  workflow_dispatch: # Pozwala na ręczne uruchomienie w każdej chwili z poziomu GitHuba

jobs:
  run-trainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy nba_api streamlit

      - name: Run calibration and learning script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python trainer.py

      - name: Commit and push updated weights and database back to repo
        run: |
          git config --global user.name "NBA AI Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add model_weights.json predictions_history.json || true
          git commit -m "Auto-calibration: Updated model weights and resolved matches [skip ci]" || true
          git push || true
          
