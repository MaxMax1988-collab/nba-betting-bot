name: NBA Auto Trainer & Fetcher

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch real NBA data
        run: |
          python fetch_real_data.py

      - name: Run trainer
        run: |
          python trainer.py || true

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add team_stats.json model_weights.json || true
          git commit -m "Automatyczna aktualizacja danych NBA [skip ci]" || true
          git push || true
          
